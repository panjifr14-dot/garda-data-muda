<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c3a">
<title>Garda Data Muda</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app" id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(u,m,b){const r=await fetch(u,{method:m||"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Permintaan gagal");return j}
const ME=Object.assign({name:"Garda A",rw:"RW 02"},JSON.parse(localStorage.getItem("me")||"{}"));
const PARTNERS=["Garda B (RW 04)","Garda D (RW 02)","Garda E (RW 05)"];
const CK=[["Hunian","Lantai, dinding, atap, air minum, sanitasi"],["Aset","Kendaraan, lahan, ternak, usaha, aset yang sudah dijual"],["Komposisi keluarga","Anggota, usia sekolah, lansia, disabilitas"],["Mata pencaharian","Jenis pekerjaan dan kisaran penghasilan"],["Kejadian rentan","PHK, sakit berat, meninggal, bencana"]];
const SERV=["Jaminan kesehatan","Program Indonesia Pintar","Dokumen kependudukan","Pelatihan kerja"];
const BUKTI=["Foto kondisi rumah","Keterangan RT atau RW","Bukti pekerjaan informal","Kartu keluarga"];
const NEXT={Diajukan:"Diperiksa",Diperiksa:"Selesai"};
const S={tab:"tugas",tasks:[],appeals:[],visits:[],f:"Semua",q:"",fl:null,sheet:null,online:navigator.onLine};
const rwOf=v=>(v.match(/RW \d+/)||[""])[0], me=()=>`${ME.name} (${ME.rw})`;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2800)}
async function load(){try{[S.tasks,S.appeals,S.visits]=await Promise.all([api("/api/tasks"),api("/api/appeals"),api("/api/visits")])}catch(e){toast("Server tidak terjangkau. Pastikan npm start berjalan.")}render()}
const draftKey=id=>"draft-"+id;
function openTask(id){const t=S.tasks.find(x=>x.id===id);const d=JSON.parse(localStorage.getItem(draftKey(id))||"null");S.fl=Object.assign({t,step:0,v2:PARTNERS[0],ck:[0,0,0,0,0],photos:[],gps:"",note:"",id:null,sent:false},d||{},{t,photos:[]});render()}
const saveDraft=()=>{const f=S.fl;if(f&&!f.id)localStorage.setItem(draftKey(f.t.id),JSON.stringify({step:f.step,v2:f.v2,ck:f.ck,gps:f.gps,note:f.note}))};
const valid=f=>[rwOf(f.v2)!==ME.rw,f.ck.filter(Boolean).length>=3,f.photos.length>=1&&f.gps.length>5&&S.online][f.step];
const whyNot=f=>[`Pasangan harus dari RW yang berbeda dengan ${ME.rw}.`,"Centang minimal 3 butir yang sudah Anda periksa.",!f.photos.length?"Tambahkan minimal 1 foto rumah.":f.gps.length<=5?"Catat lokasi rumah.":!S.online?"Tidak ada sinyal. Kirim setelah online.":""][f.step];
function sheetHtml(){const k=S.sheet;if(!k)return"";let b="";
 if(k==="profil")b=`<h2>Profil Garda</h2><label class="field"><span>Nama kader</span><input id="pn" value="${esc(ME.name)}" maxlength="30"></label><label class="field"><span>RW asal</span><select id="pr">${[1,2,3,4,5].map(n=>`<option ${ME.rw==="RW 0"+n?"selected":""}>RW 0${n}</option>`).join("")}</select></label><div style="display:grid;gap:10px;margin-top:20px"><button class="btn wide" data-act="saveprofil">Simpan profil</button><button class="btn ghost wide" data-act="reset">Reset data demo</button></div>`;
 if(k==="sanggah")b=`<h2>Catat sanggah baru</h2><p class="hint">Gunakan kode keluarga, bukan nama warga.</p><label class="field"><span>Kode keluarga</span><input id="ak" placeholder="Contoh: AS-0412" maxlength="12" autocapitalize="characters"></label><label class="field"><span>RW warga</span><select id="ar">${[1,2,3,4,5].map(n=>`<option>RW 0${n}</option>`).join("")}</select></label><div class="field"><span>Bukti yang sudah dibawa</span></div>${BUKTI.map((x,i)=>`<label class="sw"><b>${x}</b><input type="checkbox" class="ab" value="${x}"></label>`).join("")}<button class="btn wide" style="margin-top:18px" data-act="saveappeal">Simpan sanggah</button>`;
 if(k==="rujukan")b=`<h2>Rujukan layanan</h2><p class="hint">Pilih layanan yang perlu ditindaklanjuti. Garda memantau pada hari ke-30, 60, dan 90.</p>${SERV.map(x=>`<label class="sw"><b>${x}</b><input type="checkbox" class="rs" value="${x}"></label>`).join("")}<button class="btn wide" style="margin-top:18px" data-act="sendref">Kirim rujukan</button>`;
 return `<div class="scrim" data-act="closesheet"><div class="sheet" onclick="event.stopPropagation()">${b}</div></div>`}
function flowView(){const f=S.fl,t=f.t;
 const head=(h,s)=>`<div class="top"><div><h1>${h}</h1><p class="sub">${s}</p></div><button class="btn ghost sm" data-act="close">Tutup</button></div>`;
 if(f.id)return `${head("Kunjungan tersimpan",`Tugas ${t.id}, ${esc(t.signal)}`)}<main><ul class="steps"><li class="ok"><i></i><div><b>Verifikasi tersimpan</b><small>Dicatat oleh dua verifikator</small></div></li><li class="${f.sent?"ok":"wait"}"><i></i><div><b>Unggah ke operator desa</b><small>${f.sent?"Terkirim":"Menunggu Anda mengunggah"}</small></div></li><li><i></i><div><b>Penetapan desil oleh BPS</b><small>${f.sent?"Menunggu BPS":"Belum"}</small></div></li><li><i></i><div><b>Penjelasan hasil ke keluarga</b><small>Setelah ada keputusan</small></div></li></ul><p class="hint">Garda tidak mengubah data atau menetapkan desil.</p></main><div class="foot"><div class="act">${f.sent?`<button class="btn ghost" data-act="close">Selesai</button><button class="btn" data-act="sheet" data-v="rujukan">Buat rujukan layanan</button>`:`<button class="btn wide" data-act="upload">Unggah ke operator desa</button>`}</div></div>${sheetHtml()}`;
 const bodies=[`<p class="hint">Dua verifikator harus dari RW berbeda agar penilaian tidak bias.</p><label class="field"><span>Verifikator 1 (Anda)</span><input value="${esc(me())}" disabled></label><label class="field"><span>Verifikator 2</span><select data-f="v2">${PARTNERS.map(p=>`<option ${f.v2===p?"selected":""}>${p}</option>`).join("")}</select></label>${rwOf(f.v2)===ME.rw?`<p class="err">Pasangan berasal dari ${ME.rw}, sama dengan Anda. Pilih pasangan lain.</p>`:""}`,
  CK.map((c,i)=>`<label class="sw"><span><b>${c[0]}</b><small>${c[1]}</small></span><input type="checkbox" data-ck="${i}" ${f.ck[i]?"checked":""}></label>`).join("")+`<p class="hint">${f.ck.filter(Boolean).length} dari 5 butir diperiksa.</p>`,
  `<label class="btn accent wide" style="display:grid;place-items:center;cursor:pointer">Ambil atau pilih foto rumah<input type="file" id="ph" accept="image/*" capture="environment" multiple hidden></label><div class="thumbs">${f.photos.map((p,i)=>`<div><img src="${p}" alt="Foto rumah ${i+1}"><button data-act="rmph" data-v="${i}" aria-label="Hapus foto ${i+1}">×</button></div>`).join("")}</div><label class="field"><span>Lokasi rumah</span><input data-f="gps" value="${esc(f.gps)}" placeholder="Belum dicatat"></label><button class="btn ghost sm" style="margin-top:8px" data-act="gps">Catat lokasi saya</button><label class="field"><span>Catatan ketua RT (dicatat terpisah)</span><textarea data-f="note" rows="3" placeholder="Apa kata ketua RT atau tetangga?">${esc(f.note)}</textarea></label>`];
 const last=f.step===2;
 return `${head(["Pilih pasangan","Daftar periksa","Foto dan lokasi"][f.step],`Tugas ${t.id}, ${esc(t.signal)}, ${t.rw}`)}<div class="meter">${[0,1,2].map(i=>`<i class="${i<=f.step?"on":""}"></i>`).join("")}</div><main>${bodies[f.step]}</main><div class="foot"><p class="why">${valid(f)?"":whyNot(f)}</p><div class="act">${f.step?`<button class="btn ghost" data-act="back">Kembali</button>`:""}<button class="btn" data-act="${last?"send":"next"}" ${valid(f)?"":"disabled"}>${last?"Simpan kunjungan":"Lanjut"}</button></div></div>${sheetHtml()}`}
function shell(){const done=S.tasks.filter(t=>["Terkirim","Terverifikasi"].includes(t.status)).length,h=new Date().getHours(),part=h<11?"pagi":h<15?"siang":h<18?"sore":"malam";
 const T={tugas:[`Selamat ${part}, ${esc(ME.name)}`,`${done} dari ${S.tasks.length} kunjungan selesai`],sanggah:["Sanggah warga","Bantu warga mengajukan sanggah di Pojok Sanggah."],riwayat:["Riwayat kunjungan","Semua kunjungan yang sudah Anda simpan."]}[S.tab];
 let c="";
 if(S.tab==="tugas"){const list=S.tasks.filter(t=>(S.f==="Semua"||t.status===S.f)&&(t.signal+t.rw).toLowerCase().includes(S.q.toLowerCase()));
  c=`<div class="chips">${["Semua","Baru","Dijadwalkan","Terverifikasi","Terkirim"].map(x=>`<button class="chip" aria-pressed="${S.f===x}" data-act="filter" data-v="${x}">${x}</button>`).join("")}</div><input class="find" id="q" data-f="q" type="search" placeholder="Cari sinyal atau RW" value="${esc(S.q)}">`+
  (list.length?list.map(t=>`<button class="row ${t.status==="Terkirim"?"sent":""}" data-act="open" data-v="${t.id}"><span class="bar"></span><span><b>${esc(t.signal)}</b><small>${t.rw}, batas ${t.due}</small></span><span class="pill ${t.status}">${t.status}</span></button>`).join(""):`<div class="empty"><b>Tidak ada tugas di sini</b>Pilih “Semua” untuk melihat seluruh penugasan.</div>`)}
 if(S.tab==="sanggah")c=`<button class="btn wide" data-act="sheet" data-v="sanggah" style="margin-top:6px">Catat sanggah baru</button>`+(S.appeals.length?S.appeals.map(a=>`<div class="row" style="cursor:default"><span class="bar"></span><span><b>${a.nomor}, ${esc(a.kode)}</b><small>${a.rw}, ${JSON.parse(a.bukti).length} bukti</small></span><span style="text-align:right"><span class="pill ${a.status}">${a.status}</span>${NEXT[a.status]?`<br><button class="btn ghost sm" style="margin-top:6px" data-act="adv" data-v="${a.id}">Tandai ${NEXT[a.status].toLowerCase()}</button>`:""}</span></div>`).join(""):`<div class="empty"><b>Belum ada sanggah</b>Catat sanggah pertama saat warga datang ke Pojok Sanggah.</div>`);
 if(S.tab==="riwayat")c=S.visits.length?S.visits.map(v=>`<div class="row" style="cursor:default"><span class="bar" style="background:var(--pandan)"></span><span><b>Kunjungan ${v.id}, tugas ${v.task_id}</b><small>${new Date(v.created_at.replace(" ","T")+"Z").toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}</small></span><span class="pill ${v.uploaded?"Terkirim":"Terverifikasi"}">${v.uploaded?"Terkirim":"Tersimpan"}</span></div>`).join(""):`<div class="empty"><b>Belum ada kunjungan</b>Mulai dari tab Tugas.</div>`;
 return `${S.online?"":`<div class="offline">Tidak ada sinyal. Draf tetap aman di perangkat.</div>`}<div class="top"><div><h1>${T[0]}</h1><p class="sub">${T[1]}</p></div><button class="btn ghost sm" data-act="sheet" data-v="profil">Profil</button></div>${S.tab==="tugas"?`<div class="meter">${S.tasks.map((t,i)=>`<i class="${i<done?"on":""}"></i>`).join("")}</div>`:""}<main>${c}</main><nav class="tabbar">${[["tugas","Tugas"],["sanggah","Sanggah"],["riwayat","Riwayat"]].map(x=>`<button data-act="tab" data-v="${x[0]}" ${S.tab===x[0]?'aria-current="page"':""}>${x[1]}</button>`).join("")}</nav>${sheetHtml()}`}
function render(){$("#app").innerHTML=S.fl?flowView():shell()}
const A=$("#app");
A.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v,f=S.fl;
 try{
 if(a==="tab"){S.tab=v}else if(a==="filter"){S.f=v}else if(a==="open"){return openTask(v)}
 else if(a==="close"){S.fl=null;await load();return}else if(a==="back"){f.step--;saveDraft()}else if(a==="next"){f.step++;saveDraft()}
 else if(a==="rmph"){f.photos.splice(+v,1)}
 else if(a==="gps"){return navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{f.gps=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} (±${Math.round(p.coords.accuracy)} m)`;saveDraft();render()},()=>toast("Lokasi tidak terbaca. Izinkan akses lokasi, atau ketik koordinat manual."),{enableHighAccuracy:true,timeout:10000}):toast("Perangkat tidak mendukung lokasi. Ketik koordinat manual.")}
 else if(a==="send"){const r=await api("/api/visits","POST",{task_id:f.t.id,v1:me(),v2:f.v2,checklist:f.ck,photos:f.photos.length,gps:true,note:f.note});f.id=r.id;localStorage.removeItem(draftKey(f.t.id));toast("Kunjungan tersimpan")}
 else if(a==="upload"){await api(`/api/visits/${f.id}/upload`,"POST");f.sent=true;toast("Terkirim ke operator desa")}
 else if(a==="sheet"){S.sheet=v}else if(a==="closesheet"){S.sheet=null}
 else if(a==="saveprofil"){ME.name=($("#pn").value.trim()||"Garda A");ME.rw=$("#pr").value;localStorage.setItem("me",JSON.stringify(ME));S.sheet=null;toast("Profil disimpan")}
 else if(a==="reset"){await api("/api/demo/reset","POST");Object.keys(localStorage).filter(k=>k.startsWith("draft-")).forEach(k=>localStorage.removeItem(k));S.sheet=null;await load();toast("Data demo dikembalikan");return}
 else if(a==="saveappeal"){const r=await api("/api/appeals","POST",{kode:$("#ak").value.trim(),rw:$("#ar").value,bukti:[...document.querySelectorAll(".ab:checked")].map(x=>x.value)});S.sheet=null;S.appeals=await api("/api/appeals");toast(`Sanggah ${r.nomor} tersimpan`)}
 else if(a==="adv"){await api(`/api/appeals/${v}`,"PATCH");S.appeals=await api("/api/appeals");toast("Status sanggah diperbarui")}
 else if(a==="sendref"){await api("/api/referrals","POST",{visit_id:f.id,services:[...document.querySelectorAll(".rs:checked")].map(x=>x.value)});S.sheet=null;toast("Rujukan dikirim. Tindak lanjut hari ke-30.")}
 }catch(err){toast(err.message)}
 render()});
A.addEventListener("change",e=>{const t=e.target,f=S.fl;if(!f)return;
 if(t.dataset.ck!==undefined){f.ck[+t.dataset.ck]=t.checked?1:0;saveDraft();render()}
 else if(t.dataset.f==="v2"){f.v2=t.value;saveDraft();render()}
 else if(t.id==="ph"){[...t.files].slice(0,3-f.photos.length).forEach(x=>f.photos.push(URL.createObjectURL(x)));render()}});
A.addEventListener("input",e=>{const t=e.target,f=S.fl;
 if(t.dataset.f==="q"){S.q=t.value;const p=t.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(p,p)}
 else if(f&&(t.dataset.f==="note"||t.dataset.f==="gps")){f[t.dataset.f]=t.value;saveDraft();if(t.dataset.f==="gps"){const b=$(".foot .btn:last-child");if(b)b.disabled=!valid(f)}}});
addEventListener("online",()=>{S.online=true;render()});addEventListener("offline",()=>{S.online=false;render()});
load();
</script></body></html>
